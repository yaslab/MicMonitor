<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>MicMonitor iPad 横</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1180px; height: 820px; background: #000000">
  <dc-import name="Main" layout="tabletLandscape" state="running" monitor-on="{{yes}}" hint-size="1180px,820px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
