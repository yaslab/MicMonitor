<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>MicMonitor カード</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: {{cardW}}; box-sizing: border-box; position: relative; display: flex; flex-direction: column; gap: 8px; padding: 9px 11px 11px; background: {{t.hud}}; backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6); border: 1px solid {{t.hudBorder}}; border-radius: 12px; box-shadow: {{t.hudShadow}}; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 11px">

  <div style="display: flex; align-items: center; gap: 4px; height: 24px">
    <button onClick="{{togglePause}}" aria-label="{{pauseLabel}}" style="width: 24px; height: 24px; flex-shrink: 0; padding: 0; border: none; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: {{pauseBg}}; color: {{pauseFg}}">
      <sc-if value="{{running}}" hint-placeholder-val="{{ true }}">
        <svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1.5" width="3" height="9" rx="0.8" fill="currentColor"></rect><rect x="7" y="1.5" width="3" height="9" rx="0.8" fill="currentColor"></rect></svg>
      </sc-if>
      <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
        <svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.6 L10.4 6 L3 10.4 Z" fill="currentColor"></path></svg>
      </sc-if>
    </button>
    <span style="flex: 1; min-width: 0; padding-left: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{deviceName}}</span>
    <button onClick="{{toggleWave}}" aria-label="波形を表示" aria-pressed="{{wavePressed}}" style="width: 24px; height: 24px; flex-shrink: 0; padding: 0; border: none; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: {{waveBtnBg}}; color: {{waveBtnFg}}">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M1.5 8 H2.5 M5 5 V11 M8 2.5 V13.5 M11 5 V11 M13.5 8 H14.5"></path></svg>
    </button>
    <button onClick="{{toggleSpec}}" aria-label="スペクトルを表示" aria-pressed="{{specPressed}}" style="width: 24px; height: 24px; flex-shrink: 0; padding: 0; border: none; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: {{specBtnBg}}; color: {{specBtnFg}}">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 13.5 V9 M6 13.5 V4.5 M9.5 13.5 V7 M13 13.5 V10.5"></path></svg>
    </button>
    <button onClick="{{toggleMenu}}" aria-label="メニュー" aria-expanded="{{menuExpanded}}" style="width: 24px; height: 24px; flex-shrink: 0; padding: 0; border: none; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: {{menuBtnBg}}; color: {{t.textSoft}}">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3" fill="currentColor"></circle><circle cx="8" cy="8" r="1.3" fill="currentColor"></circle><circle cx="12.5" cy="8" r="1.3" fill="currentColor"></circle></svg>
    </button>
  </div>

  <sc-if value="{{running}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{meters}}" as="m" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 1px">
          <div style="height: 11px; text-align: right; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 9px; line-height: 11px; font-variant-numeric: tabular-nums; color: {{m.textColor}}">{{m.holdText}}</div>
          <div style="display: flex; align-items: center; gap: 2px; height: 7px">
            <div style="flex: 1; position: relative; height: 7px; border-radius: 2px; overflow: hidden; -webkit-mask-image: {{zoneMask}}; mask-image: {{zoneMask}}">
              <div style="position: absolute; inset: 0; background: {{t.hudTrack}}"></div>
              <div style="position: absolute; inset: 0; opacity: 0.38; background: linear-gradient(to right, {{t.mG}} 0%, {{t.mG}} 70%, {{t.mY}} 70%, {{t.mY}} 90%, {{t.mR}} 90%, {{t.mR}} 100%); clip-path: {{m.peakClip}}"></div>
              <div style="position: absolute; inset: 0; background: linear-gradient(to right, {{t.mG}} 0%, {{t.mG}} 70%, {{t.mY}} 70%, {{t.mY}} 90%, {{t.mR}} 90%, {{t.mR}} 100%); clip-path: {{m.rmsClip}}"></div>
              <div style="position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; left: {{m.holdLeft}}; background: {{m.holdColor}}"></div>
            </div>
            <span aria-hidden="true" style="width: 4px; height: 7px; flex-shrink: 0; border-radius: 1.5px; background: {{m.clipBg}}; box-shadow: {{m.clipGlow}}"></span>
          </div>
        </div>
      </sc-for>
      <div style="display: flex; gap: 2px; margin-top: 1px">
        <div style="flex: 1; height: 2px; border-radius: 1px; opacity: {{t.stripOpacity}}; background: linear-gradient(to right, {{t.mG}} 0%, {{t.mG}} 70%, {{t.mY}} 70%, {{t.mY}} 90%, {{t.mR}} 90%, {{t.mR}} 100%); -webkit-mask-image: {{zoneMask}}; mask-image: {{zoneMask}}"></div>
        <span style="width: 4px; flex-shrink: 0"></span>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
    <div style="height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 5px; background: {{t.pausedBox}}; color: {{t.textSoft}}; font-size: 11px">計測を停止中</div>
  </sc-if>

  <div style="display: flex; align-items: center; gap: 6px; height: 18px">
    <button aria-label="入力をミュート" style="width: 18px; height: 18px; flex-shrink: 0; padding: 0; border: none; background: transparent; color: {{t.textSoft}}; display: flex; align-items: center; justify-content: center">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5"></rect><path d="M3 7.5 a5 5 0 0 0 10 0 M8 12.5 V14.5"></path></svg>
    </button>
    <div style="flex: 1; position: relative; height: 18px">
      <div style="position: absolute; left: 0; right: 0; top: 7px; height: 3px; border-radius: 2px; background: {{t.sliderTrack}}"></div>
      <div style="position: absolute; left: 0; top: 7px; height: 3px; width: 62%; border-radius: 2px; background: {{t.accent}}"></div>
      <sc-for list="{{volTicks}}" as="t" hint-placeholder-count="7">
        <div style="position: absolute; top: 13px; left: {{t.left}}; width: 1px; height: 3px; background: {{t.tick}}"></div>
      </sc-for>
      <div style="position: absolute; left: 62%; top: 2.5px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: {{t.knob}}; box-shadow: {{t.knobShadow}}"></div>
      <input type="range" min="0" max="100" value="62" aria-label="入力音量" style="position: absolute; inset: 0; width: 100%; margin: 0; opacity: 0">
    </div>
  </div>

  <sc-if value="{{showWave}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 3px">
      <sc-for list="{{waves}}" as="w" hint-placeholder-count="2">
        <div style="position: relative; height: 36px; border-radius: 4px; background: {{t.well}}; overflow: hidden">
          <div style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: {{t.centerLine}}"></div>
          <svg viewBox="0 0 200 100" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%">
            <path d="{{w.peak}}" fill="{{t.accent}}" fill-opacity="0.45"></path>
            <path d="{{w.rms}}" fill="{{t.rms}}"></path>
          </svg>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{showSpectrum}}" hint-placeholder-val="{{ true }}">
    <button onClick="{{toggleMode}}" aria-label="スペクトログラムに切り替え" style="position: relative; display: block; width: 100%; height: 36px; padding: 0; border: none; border-radius: 4px; background: {{t.well}}; overflow: hidden">
      <svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%">
        <path d="{{spArea}}" fill="{{t.accent}}" fill-opacity="0.5"></path>
        <path d="{{spPeak}}" fill="none" stroke="{{t.peakLine}}" stroke-opacity="0.85" stroke-width="1" vector-effect="non-scaling-stroke"></path>
      </svg>
    </button>
  </sc-if>
  <sc-if value="{{showSpectrogram}}" hint-placeholder-val="{{ false }}">
    <button onClick="{{toggleMode}}" aria-label="スペクトルに切り替え" style="display: flex; width: 100%; height: 36px; padding: 0; border: none; border-radius: 4px; background: {{t.plot}}; overflow: hidden">
      <sc-for list="{{specCols}}" as="c" hint-placeholder-count="30">
        <span style="flex: 1 1 0; min-width: 0; height: 100%; background: {{c.bg}}"></span>
      </sc-for>
    </button>
  </sc-if>

  <sc-if value="{{hasError}}" hint-placeholder-val="{{ false }}">
    <p style="margin: 0; font-size: 10px; line-height: 1.45; color: {{t.errorText}}; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{error}}</p>
  </sc-if>

  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
    <div role="menu" style="position: absolute; top: 34px; right: 6px; width: 208px; box-sizing: border-box; padding: 5px; display: flex; flex-direction: column; gap: 1px; background: {{t.menu}}; border: 1px solid {{t.hudBorder}}; border-radius: 8px; box-shadow: {{t.menuShadow}}; z-index: 2; font-size: 13px">
      <button role="menuitem" style="height: 24px; padding: 0 10px; border: none; border-radius: 4px; background: #0A64D6; color: #FFFFFF; text-align: left">ウィンドウ表示に切り替え</button>
      <button role="menuitem" style="height: 24px; padding: 0 10px; border: none; border-radius: 4px; background: transparent; text-align: left">設定…</button>
      <div style="height: 1px; margin: 4px 6px; background: {{t.menuDivider}}"></div>
      <button role="menuitem" style="height: 24px; padding: 0 10px; border: none; border-radius: 4px; background: transparent; text-align: left">終了</button>
    </div>
  </sc-if>
</div>
</x-dc>

      toggleSpec: function () { self.setState({ showSpec: !showSpec }); },
      toggleMenu: function () { self.setState({ menuOpen: !menuOpen }); },
      toggleMode: function () { if (!paused) self.setState({ spectrogram: !sgram }); },
      wavePressed: showWave ? 'true' : 'false', specPressed: showSpec ? 'true' : 'false', menuExpanded: menuOpen ? 'true' : 'false',
      waveBtnBg: showWave ? t.toggleBg : 'transparent', waveBtnFg: showWave ? t.toggleFg : t.text2,
      specBtnBg: showSpec ? t.toggleBg : 'transparent', specBtnFg: showSpec ? t.toggleFg : t.text2,
      menuBtnBg: menuOpen ? t.menuBtnBg : 'transparent',
      meters: meters, zoneMask: ZONE_MASK,
      volTicks: [0, 17, 33, 50, 67, 83, 100].map(function (v) { return { left: v + '%' }; }),
      showWave: showWave,
      waves: this._c.waves.slice(0, ch),
      showSpectrum: showSpec && !sgram && !paused,
      showSpectrogram: showSpec && sgram,
      specCols: this._c.cols, spArea: this._c.spArea, spPeak: this._c.spPeak,
      hasError: err.length > 0, error: err, menuOpen: menuOpen, t: t
    };
  }
}
</script>
</body>
