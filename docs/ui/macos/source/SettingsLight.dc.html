<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>MicMonitor 設定（ライト）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 560px; height: 720px; background: #ECECEC">
  <dc-import name="Settings" theme="{{light}}" hint-size="560px,720px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return { light: 'light', yes: true, no: false }; }
}
</script>
</body>
</html>
